baseurl = "https://mixmix.nz"
languageCode = "en-us"
title = "mixmix"

enableEmoji = true

# Theme i18n support
# Available values: en, fr, id, ja, ko, pt-br, zh-cn, zh-tw, es, de, nl, it, th, el, uk, ar
defaultContentLanguage = "en"

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = false

# Change it to your Disqus shortname before using
disqusShortname = "hugo-theme-stack"

# Content types are sections (/pattern/, /project/, ...), not taxonomy terms,
# so `categories` is disabled. Only `tags` remains.
# Standalone HTML pages that live in a page bundle and are shown with the
# {{< embed >}} shortcode. Hugo would otherwise try to render them as content;
# the shortcode reads and publishes them itself.
# Experiment `method/` folders (prompts, scripts, raw results) are kept in the
# repo for reference but are not site content.
ignoreFiles = ['\.embed\.html$', 'experiment[\\/].*[\\/]method[\\/]']

[taxonomies]
  tag = "tags"

[pagination]
  pagerSize = 10

[imaging]
  # Hugo's default ("box") is fast but leaves jagged, blocky edges when resizing
  resampleFilter = 'lanczos'
  anchor = 'Center'

# Photos (JPEG sources) become lossy WebP. Graphics (PNG/GIF: logos, diagrams,
# screenshots) are made lossless instead -- see layouts/partials/helper/img.html
[imaging.webp]
  quality = 85
