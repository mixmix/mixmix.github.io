# Pages placed under these sections will be shown on homepage and archive page.
# `project` is included so project *updates* flow through; projects with no
# updates yet are added to the homepage by layouts/index.html.
mainSections = ["post", "pattern", "project", "invocation", "talk", "art"]
# Output page's full content in RSS.
rssFullContent = true
favicon = "/favicon.png"

[footer]
since = 2015
customText = ""

[dateFormat]
published = "Jan 02, 2006"
lastUpdated = "Jan 02, 2006 15:04 MST"

[sidebar]
# emoji = "🍥"
subtitle = "Programmer, Gardener of Community, Sci-fi nerd"

[sidebar.avatar]
enabled = true
local = true
src = "img/avatar.jpeg"

[article]
headingAnchor = false
math = false
readingTime = false

[article.license]
enabled = true
default = "Licensed under CC BY-NC-SA 4.0"

## Widgets
[[widgets.homepage]]
type = "search"

[[widgets.homepage]]
type = "tag-cloud"

[widgets.homepage.params]
limit = 10

[[widgets.homepage]]
type = "archives"

[widgets.homepage.params]
limit = 5

[[widgets.page]]
type = "toc"

[opengraph.twitter]
site = ""
card = "summary_large_image"

[defaultImage.opengraph]
enabled = false
local = false
src = ""

[colorScheme]
toggle = true
default = "light"

[imageProcessing.cover]
enabled = true

[imageProcessing.content]
enabled = true

